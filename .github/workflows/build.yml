name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Descomprimir
        run: |
          tar -xzf *.tar.gz
          echo "DIR=$(dirname $(find . -name gradlew | head -1))" >> $GITHUB_ENV
      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
